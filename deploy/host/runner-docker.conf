# Install to /etc/systemd/user/docker.service.d/noteprep.conf (root-owned, so the intended daemon flags are root-controlled and reviewable).
# This does NOT stop the runner overriding its own user-level unit under ~/.config/systemd/user (user dirs take
# precedence); the runner is not in the threat model for gaining more than it already has.
# It applies to every user's docker.service; only noteprep-runner is expected to run one.
# Rootless dockerd for the LaTeX sandbox only. Adjust the dockerd-rootless.sh path to the installed location.
# UNVERIFIED (needs the host): in rootless mode dockerd runs inside a user namespace, so --group noteprep-runner
# may map to an unmapped gid and the socket could end up group nogroup. Two candidates: `--group noteprep-runner`
# (current) or `--group 0` (namespace root, which maps to the runner's own gid on the host). After starting,
# check on the HOST: stat -c '%a %G' /run/noteprep-runner/docker.sock  -> expected '660 noteprep-runner'.
# If not, switch to the alternative. The group must be the runner's own primary group; do not use the docker group.
[Service]
ExecStart=
ExecStart=/usr/bin/dockerd-rootless.sh -H unix:///run/noteprep-runner/docker.sock --group noteprep-runner
