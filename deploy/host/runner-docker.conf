# Install to /etc/systemd/user/docker.service.d/noteprep.conf (root-owned, so the intended daemon flags are root-controlled and reviewable).
# This does NOT stop the runner overriding its own user-level unit under ~/.config/systemd/user (user dirs take
# precedence); the runner is not in the threat model for gaining more than it already has.
# It applies to every user's docker.service; only noteprep-runner is expected to run one.
# Rootless dockerd for the LaTeX sandbox only. Adjust the dockerd-rootless.sh path to the installed location.
# --group 0: in rootless mode dockerd runs inside a user namespace, so `--group noteprep-runner` is an unmapped gid
# there and the socket ends up group "nogroup" (shown as UNKNOWN by stat). Namespace gid 0 maps to the runner's own
# primary gid on the host. VERIFIED on a DigitalOcean Droplet (Ubuntu 24.04, Docker 29.9.1, 2026-10-20): with
# `--group noteprep-runner` stat gave '660 noteprep-runner UNKNOWN'; with `--group 0` it gave '660 noteprep-runner
# noteprep-runner' (also after a reboot). After starting, check on the HOST:
#   stat -c '%a %G' /run/noteprep-runner/docker.sock  -> must be '660 noteprep-runner'.
# The group must be the runner's own primary group; do not use the docker group.
[Service]
ExecStart=
ExecStart=/usr/bin/dockerd-rootless.sh -H unix:///run/noteprep-runner/docker.sock --group 0
